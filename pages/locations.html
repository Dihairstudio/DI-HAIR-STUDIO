<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Locations — DI HAIR STUDIO & NAIL</title><meta name="description" content="DI HAIR STUDIO REV & JOCA. Address, hours, WhatsApp, booking, team."><link rel="stylesheet" href="../css/style.css"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"></head><body><div id="site-header"></div><main><section class="page-hero"><div class="page-hero-inner"><p class="eyebrow">COME VISIT</p><h1>Our<br><em>Locations.</em></h1><p>REV & JOCA — struktur scalable untuk cabang baru.</p></div></section><section class="section-pad-compact" style="max-width:1240px;margin:0 auto"><div class="location-row" id="locations" data-carousel data-carousel-label="Lokasi DI HAIR"></div><div class="mobile-gesture">SWIPE</div></section></main><div id="site-footer"></div><script src="../js/data.js"></script><script src="../js/main.js"></script><script>document.addEventListener("DOMContentLoaded",()=>{document.getElementById("locations").innerHTML=DIHAIR.locations.map(x=>`<article class="location-card"><div class="loc-img-wrap">${locationPhoto(x)}<span class="loc-badge">${x.short}</span></div><div class="loc-content"><p class="loc-tagline">DI HAIR STUDIO</p><h3 class="loc-title">${x.name}</h3><p class="loc-address">${x.address}</p><div class="loc-hours-line"><strong>OPERATIONAL</strong><span>Every Day · ${x.hours||DIHAIR.hours}</span></div><div class="loc-team-preview"><span class="team-label">STUDIO ARTISTS</span><p>${x.team.join(", ")}</p></div><div class="loc-actions"><a class="loc-wa-btn" href="${x.waLink}" target="_blank" rel="noopener">WHATSAPP BRANCH</a><a class="loc-book-btn" href="${x.bookingUrl||ZENWEL_URL}" target="_blank" rel="noopener">BOOK AT ${x.short}</a></div></div></article>`).join("")})</script></body></html>
