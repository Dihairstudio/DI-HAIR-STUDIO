<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Services — DI HAIR STUDIO & NAIL</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/style.css"></head><body><div id="site-header"></div><main><section class="page-hero"><div class="page-hero-inner"><p class="eyebrow">THE COMPLETE MENU</p><h1>Services<br><em>& treatments.</em></h1><p>Individual services show no price. Harga hanya di Packages.</p></div></section><section class="section-pad-compact" style="max-width:1240px;margin:0 auto"><div class="filter-bar" id="filters"><button class="active" data-filter="all">ALL</button><button data-filter="hair">HAIR</button><button data-filter="treatment">TREATMENT</button><button data-filter="color">COLOR</button><button data-filter="chemical">CHEMICAL</button><button data-filter="perm">PERM</button><button data-filter="nail">NAIL</button></div><div class="catalog-grid" id="catalogGrid" data-carousel data-carousel-label="Katalog layanan DI HAIR"></div></section></main><div id="site-footer"></div><script src="../js/data.js"></script><script src="../js/main.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const grid=document.getElementById('catalogGrid');const render=(f)=>{grid.innerHTML=DIHAIR.catalog.filter(x=>f==='all'||x[2]===f).map(x=>`<article class="catalog-item">${picTag(x[3], 'catalog', x[0])}<div class="catalog-body"><span class="catalog-cat">${x[2].toUpperCase()}</span><h3>${x[0]}</h3><p>${x[1]}</p><div class="catalog-actions"><a class="text-link" href="../index.html#booking">EXPLORE</a><a class="catalog-book" href="${ZENWEL_URL}" target="_blank" rel="noopener">BOOK</a></div></div></article>`).join('')};render('all');document.getElementById('filters').addEventListener('click',e=>{if(e.target.tagName!=='BUTTON')return;document.querySelectorAll('#filters button').forEach(b=>b.classList.remove('active'));e.target.classList.add('active');render(e.target.dataset.filter)})})</script></body></html>
