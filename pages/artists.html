<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Artists — DI HAIR STUDIO & NAIL</title><meta name="description" content="Meet the people behind the work. REV & JOCA teams."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/style.css"></head><body><div id="site-header"></div><main><section class="page-hero"><div class="page-hero-inner"><p class="eyebrow">THE PEOPLE</p><h1>Our<br><em>Artists.</em></h1><p>Foto, nama, specialty/role & branch. Data existing dipertahankan.</p></div></section><section class="section-pad-compact" style="max-width:1240px;margin:0 auto"><p class="eyebrow">DI HAIR STUDIO REV</p><div class="artist-row" id="rev" data-carousel data-carousel-label="Artist DI HAIR STUDIO REV"></div><p class="eyebrow" style="margin-top:26px">DI HAIR STUDIO JOCA</p><div class="artist-row" id="joca" data-carousel data-carousel-label="Artist DI HAIR STUDIO JOCA"></div><div class="mobile-gesture">SWIPE</div></section></main><div id="site-footer"></div><script src="../js/data.js"></script><script src="../js/main.js"></script><script>document.addEventListener("DOMContentLoaded",()=>{for(const b of ["REV","JOCA"]){document.getElementById(b.toLowerCase()).innerHTML=DIHAIR.artists.filter(x=>x.branch===b).map(x=>`<article class="artist-card"><div class="artist-image">${picTag(x.image, 'artistPage', x.name)}<span class="artist-branch-pill">BRANCH ${x.branch}</span></div><div class="artist-details"><h3 class="artist-name">${x.name}</h3><p class="artist-role">${x.role}</p><p class="artist-specialty">${x.specialty||""}</p></div></article>`).join("")}})</script></body></html>
