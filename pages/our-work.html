<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Our Work — DI HAIR</title><meta name="description" content="Selected DI HAIR results. Filter hair color treatment nail."><link rel="stylesheet" href="../css/style.css"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"></head><body><div id="site-header"></div><main><section class="page-hero"><div class="page-hero-inner"><p class="eyebrow">SELECTED RESULTS</p><h1>Our Work<br><em>& results.</em></h1><p>Editorial grid desktop, swipe mobile. Foto existing dipertahankan.</p></div></section><section class="section-pad-compact" style="max-width:1240px;margin:0 auto"><div class="filter-bar" id="workFilters"><button class="active" data-f="all">ALL</button><button data-f="hair">HAIR</button><button data-f="color">COLOR</button><button data-f="treatment">TREATMENT</button><button data-f="nail">NAIL</button></div><div class="gallery-row" id="allGallery" data-carousel data-carousel-label="Galeri hasil kerja DI HAIR" style="grid-template-columns:repeat(3,1fr)"></div><div class="mobile-gesture">SWIPE</div></section></main><div id="site-footer"></div><script src="../js/data.js"></script><script src="../js/main.js"></script><script>document.addEventListener("DOMContentLoaded",()=>{const g=document.getElementById("allGallery");const render=(f)=>{g.innerHTML=DIHAIR.gallery.filter(x=>{const c=Array.isArray(x)?x[2]:x.category;return f==="all"||c===f}).map((x,i)=>{const t=Array.isArray(x)?x[0]:x.title;const im=Array.isArray(x)?x[1]:x.image;const c=Array.isArray(x)?x[2]:x.category;return `<article class="gallery-card">${picTag(im, 'gallery', t)}<div class="gallery-info"><span class="gal-cat">${c.toUpperCase()}</span><span class="gal-title">${String(i+1).padStart(2,"0")} · ${t}</span></div></article>`}).join("")};render("all");document.getElementById("workFilters").addEventListener("click",e=>{if(e.target.tagName!=="BUTTON")return;document.querySelectorAll("#workFilters button").forEach(b=>b.classList.remove("active"));e.target.classList.add("active");render(e.target.dataset.f)})})</script></body></html>
